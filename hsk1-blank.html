<html lang="ru">
<head>
<meta charset="utf-8">

<title>HSK1 · Бланк Леры</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: тетрадь с мягкими карточками — шапка с отсчётом до вс 10:00, вкладки разделов, лист с заданием, итоговая «печать» с баллами.
   Палитра — светлый бежевый, белые карточки, приглушённый красный акцент, почти чёрный текст; тёмная тема — чёрное с белым */
:root{
  --paper:#F5EFE6; --paper2:#EEE4D6; --sheet:#FFFFFF; --sheet2:#FAF6F0; --ink:#1F1B18; --muted:#76695D; --rule:#E7DDD0;
  --accent:#B5413A; --on-accent:#FFFFFF; --accent-soft:#F7E3DF; --py:#A0483E; --sky-soft:#F4EDE4;
  --red:#B5413A; --red-soft:#F7E3DF; --green:#4E7A5D; --green-soft:#E6F0E8; --gold:#B88A3E; --gold-soft:#F7EEDC;
  --shadow:0 2px 12px rgba(60,40,25,.06);
  --f-display:'Comfortaa','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-zh:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161413; --paper2:#1B1816; --sheet:#211E1C; --sheet2:#2A2624; --ink:#F6F1EB; --muted:#B4A89C; --rule:#3A3431;
  --accent:#E3847A; --on-accent:#161413; --accent-soft:#3E2623; --py:#EBA79D; --sky-soft:#2C2724;
  --red:#E3847A; --red-soft:#3E2623; --green:#93C3A3; --green-soft:#22332A; --gold:#E2BE7E; --gold-soft:#3A3123;
  --shadow:0 2px 12px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161413; --paper2:#1B1816; --sheet:#211E1C; --sheet2:#2A2624; --ink:#F6F1EB; --muted:#B4A89C; --rule:#3A3431;
  --accent:#E3847A; --on-accent:#161413; --accent-soft:#3E2623; --py:#EBA79D; --sky-soft:#2C2724;
  --red:#E3847A; --red-soft:#3E2623; --green:#93C3A3; --green-soft:#22332A; --gold:#E2BE7E; --gold-soft:#3A3123;
  --shadow:0 2px 12px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);background-image:linear-gradient(180deg,var(--paper) 0%,var(--paper2) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:18px 60px}
.wrap{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.zh{font-family:var(--f-zh)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.05;margin:4px 0 0;text-wrap:balance}
h1 .zh{color:var(--accent);font-weight:700}
.count{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1.5px solid var(--rule);border-radius:18px;box-shadow:var(--shadow);padding:8px 14px}
.count b{font-family:var(--f-display);font-size:1.5rem;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:.8rem;color:var(--muted);line-height:1.25}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{border:1.5px solid var(--rule);background:var(--sheet);border-radius:16px;box-shadow:var(--shadow);transition:background .2s,border-color .2s;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:.82rem;color:var(--muted)}
.tab .zh{font-size:1.2rem;font-weight:700}
.tab[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
@media(max-width:440px){.tab{font-size:.7rem}}

.parts{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--rule);background:var(--sheet);border-radius:30px;padding:6px 12px;font-weight:600;font-size:.84rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--green);color:var(--green);background:var(--green-soft)}

.sheet{background:var(--sheet);border:1.5px solid var(--rule);border-radius:26px;box-shadow:var(--shadow);padding:20px 18px;min-height:360px;display:flex;flex-direction:column;gap:14px;position:relative}
.bar{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);font-weight:600}
.prog{flex:1;height:8px;background:var(--sheet2);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.instr{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:1.5px dashed var(--rule);padding-bottom:10px}
.instr .zh{font-weight:700;color:var(--accent)}
.instr span{color:var(--muted);font-size:.9rem}

.py{display:block;font-size:.82rem;color:var(--py);font-weight:500;letter-spacing:.01em}
.bigzh{font-family:var(--f-zh);font-weight:700;font-size:clamp(1.5rem,6vw,2.1rem);text-align:center;line-height:1.3}
.bigzh .py{font-size:.95rem}
.pic{font-size:4.2rem;text-align:center;line-height:1.1}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:1.5px solid var(--rule);background:var(--sheet2);border-radius:16px;transition:transform .1s;padding:11px 16px;font-weight:700}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.play{background:var(--sky-soft);border-color:var(--py)}
.btn.tf{min-width:110px;font-size:1.4rem}
.btn:disabled{opacity:.45;cursor:default}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:440px){.opts.txt{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--rule);background:var(--sheet);border-radius:18px;transition:border-color .2s,background .2s;padding:12px 8px;text-align:center;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:center}
.opt .letter{font-weight:700;color:var(--muted);font-size:.8rem}
.opt .emo{font-size:2.6rem;line-height:1.15}
.opt .zh{font-size:1.25rem;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--accent)}
.ok{background:var(--green-soft)!important;border-color:var(--green)!important;color:var(--green)}
.bad{background:var(--red-soft)!important;border-color:var(--red)!important;color:var(--red)}
.opt:disabled{cursor:default}
.fb{text-align:center;font-weight:700;min-height:1.4em}
.fb.ok,.fb.bad{background:none!important;border:0}
.reveal{background:var(--sky-soft);border-radius:16px;padding:10px 14px;text-align:center}
.reveal .zh{font-weight:700;font-size:1.1rem}
.reveal small{display:block;color:var(--muted)}
.q{font-weight:700;text-align:center;font-size:1.15rem}
.q .zh{display:block;font-size:1.35rem}
.note{background:var(--gold-soft);border-radius:16px;padding:9px 13px;font-size:.86rem}

/* set */
.pool{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:520px){.pool{grid-template-columns:repeat(2,1fr)}}
.pitem{border:1.5px solid var(--rule);border-radius:16px;background:var(--sheet2);padding:8px 10px;display:flex;gap:8px;align-items:flex-start;min-width:0}
.pitem b{font-family:var(--f-display);color:var(--py)}
.pitem .zh{font-weight:700}
.pitem.used{opacity:.45}
.srow{border-top:1.5px solid var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.srow .zh{font-weight:700;font-size:1.15rem}
.letters{display:flex;gap:6px;flex-wrap:wrap}
.lt{width:40px;height:40px;border:1.5px solid var(--rule);border-radius:50%;background:var(--sheet2);font-family:var(--f-display);font-weight:700}
.lt.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lt.dim{opacity:.4}
.srow.ok,.srow.bad{border-radius:10px;padding:10px}
.srow small{color:var(--muted)}

/* keys */
.keys{width:100%;border-collapse:collapse;font-size:.92rem}
.keys td{border-top:1px solid var(--rule);padding:8px 6px;vertical-align:top}
.keys td:first-child{font-family:var(--f-zh);font-weight:700;white-space:nowrap;color:var(--accent);font-size:1.05rem}
.keys td:last-child{font-family:var(--f-zh);color:var(--muted)}
.tblwrap{overflow-x:auto}
.tips{display:grid;gap:8px}
.tips div{background:var(--sheet2);border-radius:16px;padding:9px 12px;font-size:.92rem}
.tips b{color:var(--green)}

/* result */
.stamp{align-self:center;border:3px dashed var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:24px;padding:10px 22px;text-align:center;transform:rotate(-3deg)}
.stamp.pass{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.stamp b{font-family:var(--f-display);font-size:2.6rem;display:block;line-height:1;font-variant-numeric:tabular-nums}
.stamp span{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.scores div{background:var(--sheet2);border-radius:16px;padding:10px;text-align:center}
.scores b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.scores small{color:var(--muted);font-weight:600}
.partlist{font-size:.9rem;display:grid;gap:4px}
.partlist div{display:flex;justify-content:space-between;border-top:1px solid var(--rule);padding-top:4px;font-variant-numeric:tabular-nums}
.mist{display:grid;gap:6px}
.mist div{background:var(--red-soft);border-radius:14px;padding:7px 11px;font-size:.88rem}
.mist .zh{font-weight:700}
.timer{position:absolute;top:14px;right:16px;font-family:var(--f-display);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.toggle{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
textarea{width:100%;min-height:110px;border:1.5px solid var(--rule);border-radius:16px;background:var(--sheet2);color:var(--ink);font:inherit;font-size:.85rem;padding:10px}
.hint{color:var(--muted);font-size:.86rem;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>body{margin:0} [hidden]{display:none!important} img{max-width:100%}</style>
</head>

const mkTF=(r,part,audio)=>({type:"tf",part,audio,zh:r[0],py:r[1],ru:r[2],pic:r[3],ok:!!r[4],picRu:r[5]||""});
const mkPick=(r,part,audio)=>{const o=r[3].map((e,i)=>({e,c:i===r[4]}));return {type:"pick",part,audio,zh:r[0],py:r[1],ru:r[2],opts:shuffle(o)}};
const mkQA=r=>({type:"qa",part:"L4",audio:true,zh:r[0],py:r[1],ru:r[2],q:r[3],qpy:r[4],qru:r[5],opts:shuffle(r[6].map((o,i)=>({o,c:i===r[7]})))});
const mkSet=(s,part)=>{const order=shuffle(s.opts.map((o,i)=>({o,i})));return {type:"set",part,opts:order.map(x=>x.o),qs:shuffle(s.qs).map(q=>({zh:q[0],py:q[1],ru:q[2],ans:order.findIndex(x=>x.i===q[3])}))}};
const mkKey=r=>{const wrong=shuffle(TYPES.map((t,i)=>i).filter(i=>i!==r[2])).slice(0,3);return {type:"key",part:"K1",zh:r[0],py:r[1],opts:shuffle([r[2],...wrong]).map(i=>({t:TYPES[i],c:i===r[2]}))}};
function build(part,n){
 switch(part){
  case"L1":return shuffle(L1).slice(0,n||L1.length).map(r=>mkTF(r,"L1",true));
  case"L2":return shuffle(L2).slice(0,n||L2.length).map(r=>mkPick(r,"L2",true));
  case"L4":return shuffle(L4).slice(0,n||L4.length).map(mkQA);
  case"R1":return shuffle(R1).slice(0,n||R1.length).map(r=>mkTF(r,"R1",false));
  case"R2":return shuffle(R2).slice(0,n||R2.length).map(r=>mkPick(r,"R2",false));
  case"R3":return shuffle(R3).slice(0,n||R3.length).map(s=>mkSet(s,"R3"));
  case"R4":return shuffle(R4).slice(0,n||R4.length).map(s=>mkSet(s,"R4"));
  case"K1":return shuffle(SPRINT).slice(0,12).map(mkKey);
 }
}
const weight=q=>q.type==="set"?q.qs.length:1;

/* ===================== СЕССИЯ ===================== */
let S=null, timerInt=null;
function startSession(qs,opts){
 clearInterval(timerInt);
 S={qs,i:0,score:0,total:qs.reduce((a,q)=>a+weight(q),0),mock:!!opts.mock,label:opts.label,byPart:{},miss:[],t0:Date.now()};
 qs.forEach(q=>{S.byPart[q.part]=S.byPart[q.part]||{ok:0,n:0};S.byPart[q.part].n+=weight(q)});
 if(S.mock){timerInt=setInterval(()=>{const el=$("tmr");if(el)el.textContent=fmtT(Date.now()-S.t0)},1000);}
 show();
}
const fmtT=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function record(q,okCount,missText){S.score+=okCount;S.byPart[q.part].ok+=okCount;if(missText)S.miss.push(missText);}
function next(){S.i++;show();}
function head(q){const t=PART_TITLE[q.part];return `${S.mock?`<div class="timer" id="tmr">${fmtT(Date.now()-S.t0)}</div>`:""}
 <div class="bar"><span>${esc(S.label)}</span><div class="prog"><i style="width:${Math.round(S.i/S.qs.length*100)}%"></i></div><span>${S.i+1} / ${S.qs.length}</span></div>
 <div class="instr"><span class="zh">${t[0]}</span><span>${t[1]}</span></div>`}
function nextBtn(){return `<div class="row"><button class="btn go" id="nb">${S.i+1<S.qs.length?"Дальше →":"Результат"}</button></div>`}
function wireNext(){const b=$("nb");if(b){b.onclick=next;b.focus();}}
function show(){
 rerender=null;
 if(S.i>=S.qs.length) return finish();
 const q=S.qs[S.i];
 ({tf:showTF,pick:showPick,qa:showQA,set:showSet,key:showKey})[q.type](q);
}

/* --- верно / неверно --- */
function showTF(q){
 const draw=(done)=>{
  sheet.innerHTML=head(q)+(q.audio?ttsNote()+`<div class="row"><button class="btn play" id="pl">▶ Слушать</button><button class="btn" id="pls">🐢 Медленно</button></div>`:`<div class="bigzh">${pyHtml(q.py)}${esc(q.zh)}</div>`)+
  `<div class="pic" aria-hidden="true">${q.pic}</div>
   <div class="row"><button class="btn tf" data-v="1">✓</button><button class="btn tf" data-v="0">✗</button></div>
   <div class="fb" id="fb"></div><div id="rv"></div><div id="nx"></div>`;
  if(q.audio){$("pl").onclick=()=>speak(q.zh);$("pls").onclick=()=>speak(q.zh,.5);if(!done)setTimeout(()=>speak(q.zh),300);}
  sheet.querySelectorAll(".tf").forEach(b=>b.onclick=()=>{
   const v=b.dataset.v==="1", ok=v===q.ok;
   sheet.querySelectorAll(".tf").forEach(x=>{x.disabled=true;if((x.dataset.v==="1")===q.ok)x.classList.add("ok")});
   if(!ok)b.classList.add("bad");
   record(q,ok?1:0,ok?null:`${q.zh} (${q.py}) — ${q.ru}; ответ: ${q.ok?"✓":"✗"}`);
   if(!S.mock){$("fb").className="fb "+(ok?"ok":"bad");$("fb").textContent=ok?"Верно!":"Не совсем.";
    $("rv").innerHTML=`<div class="reveal"><span class="zh">${esc(q.zh)}</span><small>${esc(q.py)} — ${esc(q.ru)}${q.ok?"":` · на картинке: ${esc(q.picRu)}`}</small></div>`;}
   $("nx").innerHTML=nextBtn();wireNext();
  });
 };
 draw(false); rerender=null;
}
/* --- выбор картинки --- */
function showPick(q){
 sheet.innerHTML=head(q)+(q.audio?ttsNote()+`<div class="row"><button class="btn play" id="pl">▶ Слушать</button><button class="btn" id="pls">🐢 Медленно</button></div>`:`<div class="bigzh">${pyHtml(q.py)}${esc(q.zh)}</div>`)+
 `<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="letter">${LET[k]}</span><span class="emo" aria-hidden="true">${o.e}</span></button>`).join("")}</div>
  <div class="fb" id="fb"></div><div id="rv"></div><div id="nx"></div>`;
 if(q.audio){$("pl").onclick=()=>speak(q.zh);$("pls").onclick=()=>speak(q.zh,.5);setTimeout(()=>speak(q.zh),300);}
 sheet.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const ok=q.opts[+b.dataset.k].c;
  sheet.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.k].c)x.classList.add("ok")});
  if(!ok)b.classList.add("bad");
  record(q,ok?1:0,ok?null:`${q.zh} (${q.py}) — ${q.ru}`);
  if(!S.mock){$("fb").className="fb "+(ok?"ok":"bad");$("fb").textContent=ok?"Верно!":"Не совсем.";
   $("rv").innerHTML=`<div class="reveal"><span class="zh">${esc(q.zh)}</span><small>${esc(q.py)} — ${esc(q.ru)}</small></div>`;}
  $("nx").innerHTML=nextBtn();wireNext();
 });
 if(!q.audio) rerender=()=>showPick(q);
}
/* --- вопрос к диалогу --- */
function showQA(q){
 sheet.innerHTML=head(q)+ttsNote()+`<div class="row"><button class="btn play" id="pl">▶ Слушать</button><button class="btn" id="pls">🐢 Медленно</button></div>
 <div class="q"><span class="zh">${esc(q.q)}</span>${showPy?`<span class="py">${esc(q.qpy)}</span>`:""}</div>
 <div class="opts txt">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="letter">${LET[k]}</span>${pyHtml(o.o[1])}<span class="zh">${esc(o.o[0])}</span></button>`).join("")}</div>
 <div class="fb" id="fb"></div><div id="rv"></div><div id="nx"></div>`;
 const full=q.zh+"。"+q.q;
 $("pl").onclick=()=>speak(full);$("pls").onclick=()=>speak(full,.5);setTimeout(()=>speak(full),300);
 sheet.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const ok=q.opts[+b.dataset.k].c, right=q.opts.find(o=>o.c).o;
  sheet.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.k].c)x.classList.add("ok")});
  if(!ok)b.classList.add("bad");
  record(q,ok?1:0,ok?null:`${q.zh} ${q.q} — ответ: ${right[0]} (${right[2]})`);
  if(!S.mock){$("fb").className="fb "+(ok?"ok":"bad");$("fb").textContent=ok?"Верно! Ты дослушала до конца 👍":"Ловушка! Послушай ещё раз и сравни.";
   $("rv").innerHTML=`<div class="reveal"><span class="zh">${esc(q.zh)}</span><small>${esc(q.py)}<br>${esc(q.ru)} · ${esc(q.qru)} → ${esc(right[2])}</small></div>`;}
  $("nx").innerHTML=nextBtn();wireNext();
 });
}
/* --- набор: 5 вопросов, 6 ответов --- */
function showSet(q){
 q.pick=q.pick||Array(q.qs.length).fill(-1);
 const draw=()=>{
  const used=new Set(q.pick.filter(x=>x>=0));
  const isR4=q.part==="R4";
  sheet.innerHTML=head(q)+
  `<div class="pool">${q.opts.map((o,k)=>`<div class="pitem ${used.has(k)?"used":""}"><b>${LET[k]}</b><div>${pyHtml(o[1])}<span class="zh">${esc(o[0])}</span></div></div>`).join("")}</div>
  ${q.qs.map((s,n)=>{
    const chosen=q.pick[n]>=0?q.opts[q.pick[n]][0]:"（ ）";
    const txt=isR4?esc(s.zh).replace("＿",`<u>${esc(chosen)}</u>`):esc(s.zh);
    const cls=q.checked?(q.pick[n]===s.ans?"ok":"bad"):"";
    return `<div class="srow ${cls}"><div>${pyHtml(s.py)}<span class="zh">${n+1}. ${txt}</span></div>
     <div class="letters">${q.opts.map((o,k)=>`<button class="lt ${q.pick[n]===k?"sel":""} ${used.has(k)&&q.pick[n]!==k?"dim":""}" data-n="${n}" data-k="${k}" ${q.checked?"disabled":""} aria-label="Вопрос ${n+1}, вариант ${LET[k]}">${LET[k]}</button>`).join("")}</div>
     ${q.checked?`<small>${esc(s.ru)}${q.pick[n]===s.ans?"":` · правильно: ${LET[s.ans]} ${esc(q.opts[s.ans][0])}`}</small>`:""}</div>`}).join("")}
  <div class="fb" id="fb"></div>
  <div class="row" id="nx">${q.checked?"":`<button class="btn go" id="chk" ${q.pick.includes(-1)?"disabled":""}>Проверить</button>`}</div>`;
  if(!q.checked){
   sheet.querySelectorAll(".lt").forEach(b=>b.onclick=()=>{const n=+b.dataset.n,k=+b.dataset.k;
    const other=q.pick.indexOf(k); if(other>=0&&other!==n) q.pick[other]=-1;
    q.pick[n]=q.pick[n]===k?-1:k; draw();});
   const c=$("chk"); if(c) c.onclick=()=>{
    q.checked=true; let ok=0;
    q.qs.forEach((s,n)=>{if(q.pick[n]===s.ans)ok++;else S.miss.push(`${s.zh} → ${q.opts[s.ans][0]} (${s.ru})`)});
    S.score+=ok;S.byPart[q.part].ok+=ok;
    draw();
    if(!S.mock){$("fb").className="fb "+(ok===q.qs.length?"ok":"bad");$("fb").textContent=ok===q.qs.length?"5 из 5! 太棒了！":`${ok} из ${q.qs.length}. Посмотри разбор под каждой строкой.`;}
    $("nx").innerHTML=nextBtn();wireNext();
   };
  } else {$("nx").innerHTML=nextBtn();wireNext();}
 };
 draw(); rerender=draw;
}
/* --- ключ-спринт --- */
function showKey(q){
 sheet.innerHTML=head(q)+`<div class="bigzh">${pyHtml(q.py)}${esc(q.zh)}</div>
 <div class="opts txt" style="grid-template-columns:repeat(2,1fr)">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="zh" style="font-size:1rem">${esc(o.t)}</span></button>`).join("")}</div>
 <div class="fb" id="fb"></div><div id="nx"></div>`;
 sheet.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const ok=q.opts[+b.dataset.k].c, right=q.opts.find(o=>o.c).t;
  sheet.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.k].c)x.classList.add("ok")});
  if(!ok)b.classList.add("bad");
  record(q,ok?1:0,ok?null:`${q.zh} → нужен ответ: ${right}`);
  $("fb").className="fb "+(ok?"ok":"bad");$("fb").textContent=ok?"Верно!":`Нужен ответ: ${right}`;
  $("nx").innerHTML=nextBtn();wireNext();
 });
 rerender=()=>showKey(q);
}

/* ===================== ИТОГ ===================== */
function finish(){
 clearInterval(timerInt);
 const time=fmtT(Date.now()-S.t0);
 if(S.mock){
  const L=["L1","L2","L4"],R=["R1","R2","R3","R4"];
  const sum=(ps)=>ps.reduce((a,p)=>({ok:a.ok+(S.byPart[p]?.ok||0),n:a.n+(S.byPart[p]?.n||0)}),{ok:0,n:0});
  const l=sum(L),r=sum(R);const ls=Math.round(l.ok/l.n*100),rs=Math.round(r.ok/r.n*100),tot=ls+rs,pass=tot>=120;
  LOG.mock={ls,rs,tot,time,byPart:JSON.parse(JSON.stringify(S.byPart)),miss:S.miss.slice()};
  try{localStorage.setItem("lera-hsk1-mock",JSON.stringify({tot,ls,rs,d:Date.now()}))}catch(e){}
  sheet.innerHTML=`<div class="stamp ${pass?"pass":""}"><b>${tot}</b><span>${pass?"合格 · сдано":"ещё чуть-чуть"} · из 200</span></div>
   <div class="scores"><div><b>${ls}</b><small>听力 · аудирование / 100</small></div><div><b>${rs}</b><small>阅读 · чтение / 100</small></div></div>
   <div class="partlist">${Object.entries(S.byPart).map(([p,v])=>`<div><span>${PART_TITLE[p][0]}</span><span>${v.ok} / ${v.n}</span></div>`).join("")}<div><span>Время</span><span>${time}</span></div></div>
   <p class="hint">Проходной балл — 120. ${pass?"Отличный результат! В воскресенье просто повтори это.":"Посмотри ошибки ниже и потренируй эти части отдельно."}</p>
   ${S.miss.length?`<div class="mist">${S.miss.map(m=>`<div class="zh">${esc(m)}</div>`).join("")}</div>`:""}
   <div class="row"><button class="btn go" onclick="startMock()">Ещё один пробник</button></div>`;
 } else {
  LOG.practice.push({label:S.label,ok:S.score,n:S.total});
  S.miss.forEach(m=>LOG.miss.push(m));
  const pct=Math.round(S.score/S.total*100);
  sheet.innerHTML=`<div class="stamp ${pct>=80?"pass":""}"><b>${S.score}/${S.total}</b><span>${esc(S.label)}</span></div>
   <p class="hint">${pct>=90?"太棒了！ Эту часть ты знаешь.":pct>=70?"Хорошо! Повтори ошибки — и будет отлично.":"Попробуй ещё раз — второй круг всегда лучше."}</p>
   ${S.miss.length?`<div class="mist">${S.miss.map(m=>`<div class="zh">${esc(m)}</div>`).join("")}</div>`:""}
   <div class="row"><button class="btn go" id="again">Ещё раз</button></div>`;
  const part=S.qs[0].part; $("again").onclick=()=>practice(part);
 }
}

/* ===================== РЕЖИМЫ ===================== */
let mode="keys", part="K0";
function renderParts(){
 const list=PARTS[mode]||[];
 $("parts").hidden=!list.length;
 $("parts").innerHTML=list.map(([k,t])=>`<button class="chip" data-p="${k}" aria-pressed="${k===part}">${t}</button>`).join("");
 $("parts").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{part=c.dataset.p;renderParts();practice(part)});
}
function practice(p){
 if(p==="K0") return showKeys();
 const label=[...(PARTS.listen),...(PARTS.read),...(PARTS.keys)].find(x=>x[0]===p)[1];
 startSession(build(p),{label});
}
function showKeys(){
 clearInterval(timerInt); rerender=null;
 sheet.innerHTML=`<div class="instr"><span class="zh">钥匙</span><span>Смотри на вопросительное слово — оно подскажет, какой нужен ответ</span></div>
 <div class="tblwrap"><table class="keys"><tbody>${KEYS.map(k=>`<tr><td>${esc(k[0])}</td><td>${esc(k[1])}<br><b>→ ${esc(k[2])}</b></td><td>${esc(k[3])}</td></tr>`).join("")}</tbody></table></div>
 <div class="instr"><span class="zh">技巧</span><span>Тактика на экзамене</span></div>
 <div class="tips">
  <div><b>Дослушай до конца.</b> Ловушки почти всегда в числах: 三天 ≠ 星期三, 十三 ≠ 三十, 八 ≠ 十八.</div>
  <div><b>Вычёркивай использованное.</b> В частях с A–F каждый ответ идёт только один раз, один всегда лишний.</div>
  <div><b>Начинай с того, что знаешь точно.</b> Незнакомый иероглиф пропусти и вернись к нему в конце — останется 2 варианта.</div>
  <div><b>Готовые пары:</b> 对不起 → 没关系 · 谢谢 → 不客气 · 喂 → телефон ☎️.</div>
  <div><b>Аккуратно нажимай.</b> Один промах кликом — минус 5 баллов. Проверь ответы, если остаётся время.</div>
 </div>
 <div class="row"><button class="btn go" id="toSprint">Потренировать ключи →</button></div>`;
 $("toSprint").onclick=()=>{part="K1";renderParts();practice("K1")};
}
function startMock(){
 const qs=[...build("L1",5),...build("L2",5),...build("L4",5),...build("R1",5),...build("R2",5),...build("R3",1),...build("R4",1)];
 startSession(qs,{mock:true,label:"Пробник"});
}
function mockIntro(){
 clearInterval(timerInt); rerender=null;
 let last=""; try{const m=JSON.parse(localStorage.getItem("lera-hsk1-mock")||"null"); if(m) last=`<p class="hint">Прошлый пробник на этом устройстве: <b>${m.tot}</b> / 200</p>`;}catch(e){}
 sheet.innerHTML=`<div class="instr"><span class="zh">考试</span><span>Мини-пробник: все 7 частей экзамена, как в воскресенье</span></div>
 <div class="tips">
  <div><b>听力 · аудирование:</b> части 1, 2, 4 — по 5 заданий.</div>
  <div><b>阅读 · чтение:</b> части 1–4 — по 5 заданий.</div>
  <div>Подсказок и разбора по ходу нет — как на настоящем экзамене. Все ошибки покажу в конце. Баллы — из 200, проходной 120.</div>
  <div>Займёт примерно 15–20 минут. Найди тихое место и надень наушники 🎧</div>
 </div>${last}
 <div class="row"><button class="btn go" id="go">Начать пробник</button></div>`;
 $("go").onclick=startMock;
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 mode=b.dataset.m; document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-pressed",x===b));
 part=mode==="keys"?"K0":mode==="listen"?"L1":mode==="read"?"R1":"";
 renderParts();
 if(mode==="mock") mockIntro(); else practice(part);
});

/* ===================== ОТЧЁТ ===================== */
$("reportBtn").onclick=()=>{
 const d=new Date().toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
 let t=`Лера · «Бланк HSK1» · ${d}\n`;
 if(LOG.mock){t+=`\nПробник: ${LOG.mock.tot}/200 (аудирование ${LOG.mock.ls}, чтение ${LOG.mock.rs}) · время ${LOG.mock.time}\n`;
  t+=Object.entries(LOG.mock.byPart).map(([p,v])=>`  ${PART_TITLE[p][0]}: ${v.ok}/${v.n}`).join("\n")+"\n";
  if(LOG.mock.miss.length) t+="Ошибки в пробнике:\n"+LOG.mock.miss.map(m=>"  • "+m).join("\n")+"\n";}
 if(LOG.practice.length){t+="\nТренировка по частям:\n"+LOG.practice.map(p=>`  ${p.label}: ${p.ok}/${p.n}`).join("\n")+"\n";}
 if(LOG.miss.length){t+="Ошибки в тренировке:\n"+[...new Set(LOG.miss)].map(m=>"  • "+m).join("\n")+"\n";}
 if(!LOG.mock&&!LOG.practice.length) t+="\nПока ничего не пройдено.\n";
 const box=$("reportBox"),ta=$("reportTxt"); box.hidden=false; ta.value=t;
 try{navigator.clipboard.writeText(t).then(()=>{$("copyMsg").textContent="Скопировано! Отправь маме — она перешлёт учителю."},()=>{ta.select();$("copyMsg").textContent="Выдели текст и скопируй вручную."});}catch(e){ta.select();$("copyMsg").textContent="Выдели текст и скопируй вручную.";}
};

renderParts(); showKeys();
</script>

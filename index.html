<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мост к HSK2 для Леры</title>
<meta name="description" content="Шесть уроков по 60 минут: переход от HSK1 к HSK2 для Леры.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top">
  <div class="topin">
    <div class="brand">
      <h1>Мост к HSK2</h1>
      <span class="who">Лера · <span class="zh">莉拉</span> · 6 уроков по 60 мин</span>
      <div class="mode" role="group" aria-label="Режим">
        <button id="m-teacher" aria-pressed="true">Учитель</button>
        <button id="m-student" aria-pressed="false">Экран ученика</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</div>

<main class="wrap" id="main"></main>

<div class="timer" id="timer" hidden>
  <div class="in">
    <span class="tz" id="tz"></span><span class="tn" id="tn"></span>
    <span class="clock" id="clock">00:00</span>
    <button id="tpause">Пауза</button>
    <button id="tplus">+1 мин</button>
    <button id="tstop">Стоп</button>
  </div>
  <div class="bar"><i id="tbar"></i></div>
</div>

<script src="lessons.js"></script>
<script src="exercises.js"></script>
<script src="drills.js"></script>
<script src="app.js"></script>
</body>
</html>
